name: Deploy React App (Dev Branch)

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "20"

      # Step 3: Build the React App
      - name: Install dependencies and build
        run: |
          npm install
          npm run build

      # Step 4: Store SSH Key
      - name: Store SSH key
        env:
          PRIVATE_KEY: ${{ secrets.EC2_KEY_PEM }}
        run: |
          echo "$PRIVATE_KEY" > ec2_key.pem && chmod 600 ec2_key.pem

      # Step 5: Set Correct Permissions & Deploy React App
      - name: Deploy React App to EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem ubuntu@${{ secrets.EC2_PUBLIC_IP }} "
            sudo mkdir -p /var/www/html/react-app-dev &&
            sudo chown ubuntu:ubuntu /var/www/html/react-app-dev &&
            sudo rm -rf /var/www/html/react-app-dev/*"
          scp -o StrictHostKeyChecking=no -i ec2_key.pem -r build/* ubuntu@${{ secrets.EC2_PUBLIC_IP }}:/var/www/html/react-app-dev/

      # Step 6: Restart Nginx or Web Server
      - name: Restart Nginx
        run: |
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem ubuntu@${{ secrets.EC2_PUBLIC_IP }} "sudo systemctl restart nginx"

      # Step 7: Check Deployment Status
      - name: Verify Deployment
        run: |
          curl -I http://${{ secrets.EC2_PUBLIC_IP }} || exit 1
