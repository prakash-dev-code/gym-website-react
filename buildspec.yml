version: 0.2

phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region ap-southeast-2 | docker login --username AWS --password-stdin $ECR_REPO

  build:
    commands:
      - docker build -t fitness-app .
      - docker tag fitness-app:latest $ECR_REPO/fitness-app:latest

  post_build:
    commands:
      - docker push $ECR_REPO/fitness-app:latest
      - |
        COMMAND_ID=$(aws ssm send-command \
          --instance-ids "$EC2_INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --parameters commands=["bash /home/ubuntu/deploy/deploy.sh"] \
          --region ap-southeast-2 \
          --query "Command.CommandId" \
          --output text)
        echo "SSM Command ID: $COMMAND_ID"
        aws ssm wait command-executed \
          --command-id "$COMMAND_ID" \
          --instance-id "$EC2_INSTANCE_ID" \
          --region ap-southeast-2
        aws ssm get-command-invocation \
          --command-id "$COMMAND_ID" \
          --instance-id "$EC2_INSTANCE_ID" \
          --region ap-southeast-2 \
          --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}"
